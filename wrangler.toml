name = "callective"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# The site itself. Only /api/... and /c/... (clip share links) run the worker; every other file is served
# straight from Cloudflare's static assets, which are free and don't count
# toward the daily request limit.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/c/*"]
not_found_handling = "404-page"

# Holds the clip board records.
# Create it once with:  npx wrangler kv namespace create DB
# then paste the id it prints below.
[[kv_namespaces]]
binding = "DB"
id = "bd359d37b7a840759a6f60986d43b7e0"

# Holds the clip audio people send in.
# Create it once with:  npx wrangler r2 bucket create callective-clips
[[r2_buckets]]
binding = "CLIPS"
bucket_name = "callective-clips"

# History of the "Room" durable object (it held the live queue, which was removed).
# Keep these two blocks: Cloudflare needs them to know it was created and then deleted.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
deleted_classes = ["Room"]

# Every 15 minutes the worker copies the newest shows into R2 (one per run)
# so Callective Radio plays from the site's own copies instead of Prankcast.
[triggers]
crons = ["*/15 * * * *"]

# "Host your own Callective" rooms: one durable object per room code (chat + queue bot). SQLite-backed, so it runs on the free plan.
[[durable_objects.bindings]]
name = "HALL"
class_name = "Hall"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Hall"]
