name = "callective"
main = "worker/index.js"
compatibility_date = "2025-09-01"

# The site itself. Only /api/... runs the worker; every other file is served
# straight from Cloudflare's static assets, which are free and don't count
# toward the daily request limit.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Holds the clip board records.
# Create it once with:  npx wrangler kv namespace create DB
# then paste the id it prints below.
[[kv_namespaces]]
binding = "DB"
id = "bd359d37b7a840759a6f60986d43b7e0"

# Holds the clip audio people send in.
# Create it once with:  npx wrangler r2 bucket create callective-clips
[[r2_buckets]]
binding = "CLIPS"
bucket_name = "callective-clips"

# Holds the live queue that CallBot sends in.
# Nothing to create by hand: "npx wrangler deploy" sets it up the first time.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Every 15 minutes the worker copies the newest shows into R2 (one per run)
# so Callective Radio plays from the site's own copies instead of Prankcast.
[triggers]
crons = ["*/15 * * * *"]
