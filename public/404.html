<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Off the hook · The Callective</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{--cyan:#18f0ff;--pink:#ff2bd6;--text:#e6f4ff;--muted:#8e9ac4}
  html,body{margin:0;min-height:100%;background:#05040c;color:var(--text);font-family:"Chakra Petch",system-ui,sans-serif}
  main{min-height:100vh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box;
    background:linear-gradient(180deg,#05040c33,#05040ccc 75%),url(/img/art/off-the-hook.webp) center/cover no-repeat}
  .card{max-width:560px;text-align:center;background:#05040ccc;border:1px solid #18f0ff55;padding:26px 22px;box-shadow:0 0 40px #ff2bd633}
  h1{margin:0 0 8px;font-size:clamp(34px,8vw,58px);text-transform:uppercase;letter-spacing:.02em;text-shadow:0 0 4px var(--cyan),0 0 22px #18f0ff88}
  p{color:#c9d6f5;font-size:17px;line-height:1.5;margin:0 0 18px}
  small{display:block;font-family:"Share Tech Mono",monospace;color:var(--muted);margin-bottom:18px}
  a{display:inline-block;font-family:"Share Tech Mono",monospace;text-transform:uppercase;letter-spacing:.1em;color:#05040c;background:var(--cyan);padding:11px 18px;text-decoration:none;margin:4px}
  a.alt{background:transparent;color:var(--pink);border:1px solid var(--pink)}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Off the hook</h1>
    <small>ERROR 404 · THE NUMBER YOU HAVE DIALED IS NOT IN SERVICE</small>
    <p>We're sorry. The page you have reached has been disconnected or is no longer in service. Please hang up and try again.</p>
    <a href="/">Back to the Callective</a><a class="alt" href="/#archive">Browse the shows</a>
  </div>
</main>
</body>
</html>
